<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>

    <div class="calculator">

      <!-- Display -->
      <div class="display">
        <p class="operation" data-display="operation"></p>
        <p class="current-value" data-display="current-value">0</p>
      </div>

      <!-- Buttons -->
      <button class="clear" data-action="clear">C</button>
      <button class="backspace" data-action="backspace">←</button>
      <button class="operator add" data-operator="add">+</button>
      <button class="operator subtract" data-operator="subtract">−</button>

      <button class="number seven" data-digit="7">7</button>
      <button class="number eight" data-digit="8">8</button>
      <button class="number nine" data-digit="9">9</button>
      <button class="operator multiply" data-operator="multiply">×</button>

      <button class="number four" data-digit="4">4</button>
      <button class="number five" data-digit="5">5</button>
      <button class="number six" data-digit="6">6</button>
      <button class="operator divide" data-operator="divide">÷</button>

      <button class="number one" data-digit="1">1</button>
      <button class="number two" data-digit="2">2</button>
      <button class="number three" data-digit="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button class="number zero" data-digit="0">0</button>
      <button class="decimal" data-action="decimal">.</button>

    </div>

  </body>
</html>
